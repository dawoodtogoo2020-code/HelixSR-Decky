name: Desktop Qt compatibility
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  binding-check:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11.16', '3.11.17']
        qt: ['6.11.3', '6.12.0']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
      - name: Install exact binding pair and X11 dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0 libxcb-xinerama0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-render-util0 libxcb-image0 libfontconfig1 libdbus-1-3 libx11-xcb1 xvfb xauth
          python -m pip install PySide6-Essentials==${{ matrix.qt }} shiboken6==${{ matrix.qt }}
      - name: Exercise process finalization and X11 widget workflows
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -c 'import sys,PySide6,shiboken6; print(sys.version); print(PySide6.__version__,shiboken6.__version__)'
          python -m unittest discover -s tests -p 'test_desktop_*.py'
          xvfb-run -a env QT_QPA_PLATFORM=xcb python -m desktop.app --smoke-test --smoke-cycles 10
