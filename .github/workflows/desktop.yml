name: Desktop AppImage
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0 libxcb-xinerama0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-render-util0 libxcb-image0 libfontconfig1 libdbus-1-3 libx11-xcb1 xvfb xauth
          python -m pip install -r desktop/requirements-build.txt pip-audit==2.10.1
      - name: Test native UI and shared backend
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m unittest discover -s tests -p 'test_*.py'
          pip-audit -r desktop/requirements-build.txt
          python -m desktop.app --smoke-test --screenshot "$PWD/desktop-source-smoke.png"
          xvfb-run -a env QT_QPA_PLATFORM=xcb python -m desktop.app --smoke-test --smoke-cycles 5
      - name: Build and run AppImage without FUSE
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python scripts/build_appimage.py
          release-desktop/HelixSR-Desktop-*-x86_64.AppImage --appimage-extract-and-run --smoke-test --screenshot "$PWD/desktop-appimage-smoke.png"
          xvfb-run -a env QT_QPA_PLATFORM=xcb release-desktop/HelixSR-Desktop-*-x86_64.AppImage --appimage-extract-and-run --smoke-test --smoke-cycles 5
      - name: Save desktop release candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: HelixSR-Desktop
          path: |
            release-desktop/*
            desktop-*-smoke.png
          if-no-files-found: error
